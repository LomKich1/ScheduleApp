import org.jetbrains.compose.desktop.application.dsl.TargetFormat

plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.compose'
}

kotlin {
    compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
}

dependencies {
    implementation project(':shared')
    implementation(compose.desktop.currentOs)
}

compose.desktop {
    application {
        mainClass = "com.schedule.app.desktop.MainKt"

        nativeDistributions {
            // exe/msi для Windows, deb для Linux, dmg для macOS — GitHub Actions
            // соберёт тот формат, который соответствует ОС раннера (см. workflow).
            targetFormats(TargetFormat.Exe, TargetFormat.Msi, TargetFormat.Deb, TargetFormat.Dmg)
            packageName = "ScheduleApp"
            packageVersion = (project.findProperty("APP_VERSION") ?: "1.0.0").toString()

            // Упакованное приложение запускается на урезанном JRE (jlink) — в нём
            // нет модулей, которых Compose сам не просит. Без них на ПК колледжа
            // сеть «молча» не работала:
            //  • jdk.crypto.ec      — эллиптические шифры TLS (без них handshake
            //                         с большинством HTTPS-серверов падает);
            //  • jdk.crypto.mscapi  — провайдер Windows-ROOT (системное хранилище
            //                         сертификатов, куда антивирус/прокси колледжа
            //                         вписывает свой CA — см. WindowsTrustFallback);
            //  • java.naming, jdk.unsupported, java.net.http — зависимости OkHttp/Ktor.
            modules("jdk.crypto.ec", "java.naming", "jdk.unsupported", "java.net.http")
            // jdk.crypto.mscapi существует только в Windows-JDK — на macOS/Linux
            // jlink падает с «Module jdk.crypto.mscapi not found».
            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                modules("jdk.crypto.mscapi")
            }

            windows {
                menu = true
                shortcut = true
                // console = false — по умолчанию, отдельное консольное окно не открывается
            }
        }
    }
}
